services:
  versionradar:
    build: .
    ports:
      - "18899:18899"
    environment:
      VR_ENCRYPTION_KEY: ${VR_ENCRYPTION_KEY:?Generate with openssl rand -base64 32}
      VR_ADMIN_EMAIL: ${VR_ADMIN_EMAIL:-}
      VR_ADMIN_PASSWORD: ${VR_ADMIN_PASSWORD:-}
      VR_GOOGLE_CLIENT_ID: ${VR_GOOGLE_CLIENT_ID:-}
      VR_GOOGLE_CLIENT_SECRET: ${VR_GOOGLE_CLIENT_SECRET:-}
      VR_DEV_PASSWORD_AUTH: ${VR_DEV_PASSWORD_AUTH:-0}
    volumes:
      - pb_data:/app/pb_data
    restart: unless-stopped

volumes:
  pb_data:
