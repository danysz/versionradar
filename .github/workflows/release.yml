name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: cd client && flutter build web --release

      - name: Copy web assets to Go dist
        run: mkdir -p backend/server/dist && rm -rf backend/server/dist/* && cp -r client/build/web/* backend/server/dist/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Build release binaries
        shell: bash
        run: |
          VERSION="${{ inputs.tag }}"
          if [[ -z "${VERSION}" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          fi
          if [[ -z "${VERSION}" ]]; then
            VERSION="$(git describe --tags --always 2>/dev/null || echo "v0.1.0")"
          fi
          VERSION="${VERSION#backend/}"
          [[ "${VERSION}" =~ ^v ]] || VERSION="v${VERSION}"

          mkdir -p build
          cd backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "../build/versionradar-${VERSION}-linux-amd64" ./cmd/server
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "../build/versionradar-${VERSION}-darwin-arm64" ./cmd/server
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "../build/versionradar-${VERSION}-darwin-amd64" ./cmd/server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "../build/versionradar-${VERSION}-windows-amd64.exe" ./cmd/server
          cd ../build
          sha256sum * > SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: build/*
          generate_release_notes: true
